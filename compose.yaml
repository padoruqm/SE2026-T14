services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_STORAGE_ROOT: /var/lib/point-cloud-explorer
      APP_MAX_UPLOAD_BYTES: ${APP_MAX_UPLOAD_BYTES:-104857600}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - point-cloud-data:/var/lib/point-cloud-explorer
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  point-cloud-data:
